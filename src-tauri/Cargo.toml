[package]
name = "llm-router"
version = "0.1.0"
description = "LLM Router Desktop Application"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "llm_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
